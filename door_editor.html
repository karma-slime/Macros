<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPO Spooksville — Door Marker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0f1420; color:#e8eef8; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 14px; background:#161d2c; border-bottom:1px solid #263149; position:sticky; top:0; z-index:5; }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; letter-spacing:.2px; }
  button { background:#26324a; color:#e8eef8; border:1px solid #38486a; border-radius:7px; padding:6px 11px; font-size:13px; cursor:pointer; }
  button:hover { background:#2f3f5e; }
  button.primary { background:#2f6df6; border-color:#2f6df6; }
  button.primary:hover { background:#3b78ff; }
  button.danger { background:#4a2630; border-color:#6b3441; }
  label.chk { display:flex; gap:6px; align-items:center; cursor:pointer; user-select:none; }
  input[type=number], input[type=text] { background:#111827; color:#e8eef8; border:1px solid #38486a; border-radius:6px; padding:4px 6px; width:74px; font-size:13px; }
  #wrap { display:flex; gap:0; align-items:flex-start; }
  #stage { position:relative; flex:1 1 auto; overflow:auto; padding:12px; }
  #holder { position:relative; display:inline-block; line-height:0; }
  #map { display:block; max-width:100%; height:auto; cursor:crosshair; border-radius:6px; }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  aside { width:290px; flex:0 0 290px; border-left:1px solid #263149; background:#131a28; padding:12px; height:calc(100vh - 52px); overflow:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:#8fa5c8; margin:14px 0 6px; }
  #list { display:flex; flex-direction:column; gap:4px; }
  .row { display:flex; align-items:center; gap:6px; background:#1a2334; border:1px solid #263149; border-radius:6px; padding:3px 6px; font-variant-numeric:tabular-nums; }
  .row.sel { border-color:#2f6df6; background:#1d2b47; }
  .row .id { color:#7f93b5; width:26px; font-size:12px; }
  .row input { width:56px; padding:2px 4px; font-size:12px; }
  .row .del { margin-left:auto; background:none; border:none; color:#8b6b74; cursor:pointer; font-size:14px; padding:0 3px; }
  .row .del:hover { color:#ff7b8f; }
  .hint { color:#8fa5c8; font-size:12px; line-height:1.5; }
  #status { font-size:12px; color:#9fb3d1; margin-left:auto; }
  .legend { display:flex; gap:10px; font-size:11px; color:#8fa5c8; margin-top:8px; flex-wrap:wrap;}
  .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1>Spooksville door marker</h1>
  <button id="addMode" class="primary">+ Add doors</button>
  <label class="chk"><input type="checkbox" id="showNav"> show walkable mask</label>
  <label class="chk"><input type="checkbox" id="showCand"> show auto-detected</label>
  <button id="acceptCand">Accept all auto-detected</button>
  <button id="clear" class="danger">Clear all</button>
  <button id="export" class="primary">Download doors.json</button>
  <span id="status"></span>
</header>

const SEEDS = [[1076.8, 181.0], [1106.8, 193.1], [1148.1, 192.9], [982.7, 291.6], [833.9, 391.3], [256.5, 440.3], [217.4, 458.3], [1254.7, 463.3], [524.7, 544.7], [815.7, 559.2], [804.4, 686.4], [369.6, 716.9], [970.8, 738.5], [542.7, 777.8], [561.2, 836.1], [906.4, 829.1], [1215.9, 825.7], [356.1, 848.1], [619.8, 952.1], [975.8, 949.8], [1123.6, 941.2], [943.2, 973.2], [990.5, 972.6], [1229.8, 993.1], [1274.8, 1072.8], [577.8, 1082.2], [912.0, 1081.8], [959.6, 1112.4], [1084.5, 1115.2], [1133.1, 1115.2], [408.5, 1133.1], [559.2, 1129.4], [589.7, 1204.9], [1361.1, 1209.3]];             // auto-detected candidate points (image px)
const META = {"W": 1500, "H": 1492, "origW": 2598, "origH": 2584, "sx": 0.5773672055427251, "sy": 0.5773993808049536};               // {W,H,origW,origH}

const img = document.getElementById('map');
const overlay = document.getElementById('overlay');
const holder = document.getElementById('holder');
const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');
const showNav = document.getElementById('showNav');
const showCand = document.getElementById('showCand');
let addMode = true, doors = [], dragIdx = -1, selIdx = -1, accepted = new Set();

// ---------- helpers ----------
function scale() { return img.clientWidth / META.W; }
function toImg(ev) {
  const r = img.getBoundingClientRect();
  const s = r.width / META.W;
  return { x: (ev.clientX - r.left) / s, y: (ev.clientY - r.top) / s };
}
function toScreen(p) { const s = scale(); return { x: p.x * s, y: p.y * s }; }

// ---------- render ----------
function draw() {
  const s = scale();
  overlay.setAttribute('width', img.clientWidth);
  overlay.setAttribute('height', img.clientHeight);
  overlay.setAttribute('viewBox', `0 0 ${img.clientWidth} ${img.clientHeight}`);
  let out = '';
  // auto-detected candidates
  if (showCand.checked) {
    SEEDS.forEach((p, i) => {
      if (accepted.has(i)) return;
      out += `<rect x="${p[0]*s-7}" y="${p[1]*s-7}" width="14" height="14" rx="3"
               fill="rgba(51,209,122,.22)" stroke="#33d17a" stroke-width="1.6"/>`;
    });
  }
  // user doors
  doors.forEach((d, i) => {
    const p = toScreen(d), sel = i === selIdx;
    out += `<circle cx="${p.x}" cy="${p.y}" r="9" fill="rgba(47,109,246,${sel?0.55:0.3})"
             stroke="${sel?'#8ab4ff':'#2f6df6'}" stroke-width="${sel?2.4:1.8}"/>`;
    out += `<text x="${p.x}" y="${p.y+4}" font-size="10" font-family="system-ui" text-anchor="middle"
             fill="#dce8ff" style="pointer-events:none">${i+1}</text>`;
  });
  overlay.innerHTML = out;
  document.getElementById('count').textContent = `(${doors.length})`;
  statusEl.textContent = `${doors.length} doors · zoom of ${img.clientWidth}px wide`;
}
function renderList() {
  listEl.innerHTML = '';
  doors.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === selIdx ? ' sel' : '');
    row.innerHTML = `<span class="id">${i+1}</span>
      <input type="number" value="${Math.round(d.x)}" data-k="x" data-i="${i}">
      <input type="number" value="${Math.round(d.y)}" data-k="y" data-i="${i}">
      <button class="del" data-i="${i}" title="delete">✕</button>`;
    row.onclick = e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { selIdx = i; draw(); renderList(); } };
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('input').forEach(inp => {
    inp.onchange = e => {
      const i = +e.target.dataset.i, k = e.target.dataset.k;
      doors[i][k] = parseFloat(e.target.value) || 0;
      // convert back to original map px for storage
      draw();
    };
  });
  listEl.querySelectorAll('.del').forEach(b => {
    b.onclick = e => { e.stopPropagation(); doors.splice(+b.dataset.i, 1); draw(); renderList(); };
  });
}

// ---------- interaction ----------
img.addEventListener('mousedown', ev => {
  const p = toImg(ev);
  // hit-test existing markers (in image px, 14px radius)
  const hit = doors.findIndex(d => Math.hypot(d.x - p.x, d.y - p.y) < 13);
  if (hit >= 0 && !addMode) { dragIdx = hit; selIdx = hit; draw(); renderList(); return; }
  if (hit >= 0 && addMode) { dragIdx = hit; selIdx = hit; draw(); renderList(); return; }
  if (!addMode) return;
  doors.push({ x: Math.round(p.x), y: Math.round(p.y) });
  selIdx = doors.length - 1;
  draw(); renderList();
});
window.addEventListener('mousemove', ev => {
  if (dragIdx < 0) return;
  const p = toImg(ev);
  doors[dragIdx] = { x: Math.round(p.x), y: Math.round(p.y) };
  draw();
});
window.addEventListener('mouseup', () => { if (dragIdx >= 0) { dragIdx = -1; renderList(); } });
window.addEventListener('resize', () => { draw(); });
document.getElementById('addMode').onclick = e => {
  addMode = !addMode;
  e.target.textContent = addMode ? '+ Add doors' : 'Add mode OFF';
  e.target.classList.toggle('primary', addMode);
};
showNav.onchange = () => {
  let im = document.getElementById('navimg');
  if (showNav.checked) {
    if (!im) {
      im = document.createElement('img');
      im.id = 'navimg'; im.src = MAP_B64;
      Object.assign(im.style, { position:'absolute', inset:'0', width:'100%', height:'100%',
        opacity:'0.4', mixBlendMode:'screen', pointerEvents:'none', borderRadius:'6px' });
      holder.insertBefore(im, img.nextSibling);
    }
  } else if (im) im.remove();
};
showCand.onchange = draw;
document.getElementById('acceptCand').onclick = () => {
  SEEDS.forEach((p, i) => {
    if (accepted.has(i)) return;
    if (doors.some(d => Math.hypot(d.x - p[0], d.y - p[1]) < 18)) { accepted.add(i); return; }
    doors.push({ x: Math.round(p[0]), y: Math.round(p[1]) }); accepted.add(i);
  });
  draw(); renderList();
};
document.getElementById('clear').onclick = () => {
  if (!confirm('Remove all doors?')) return;
  doors = []; accepted.clear(); selIdx = -1; draw(); renderList();
};
document.getElementById('export').onclick = () => {
  const out = {
    map_size: [META.origW, META.origH],
    map_image: 'Spooksville_Interactive_Map (1).png',
    doors: doors.map((d, i) => ({
      id: i + 1,
      x: +(d.x / META.W * META.origW).toFixed(1),
      y: +(d.y / META.H * META.origH).toFixed(1),
      name: 'door_' + (i + 1)
    }))
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'doors.json'; a.click();
  URL.revokeObjectURL(a.href);
};
img.onload = () => { draw(); renderList(); };
if (img.complete) { draw(); renderList(); }
</script>
